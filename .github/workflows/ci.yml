name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduerp_owner
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: eduerp
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U eduerp_owner" --health-interval 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      # CI-only throwaway credentials for the ephemeral service container.
      PGPASSWORD: ci_owner_pw
      TEST_DATABASE_OWNER_URL: postgresql://eduerp_owner:ci_owner_pw@localhost:5433/eduerp_test
      TEST_DATABASE_URL: postgresql://eduerp_app:ci_app_pw@localhost:5433/eduerp_test
      DATABASE_URL: postgresql://eduerp_app:ci_app_pw@localhost:5433/eduerp_test
      DATABASE_OWNER_URL: postgresql://eduerp_owner:ci_owner_pw@localhost:5433/eduerp_test
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create runtime role and test database
        run: |
          psql -h localhost -p 5433 -U eduerp_owner -d eduerp -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE eduerp_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci_app_pw'" \
            -c "CREATE DATABASE eduerp_test OWNER eduerp_owner"
      - name: Generate JWT secret
        run: echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm typecheck
      - name: Integration tests (RLS, auth, audit)
        working-directory: apps/api
        run: npx jest --runInBand
      - name: OpenAPI document is up to date
        run: |
          pnpm --filter @eduerp/api openapi:export
          git diff --exit-code docs/api/openapi.json || (echo "::error::docs/api/openapi.json is stale - run pnpm --filter @eduerp/api openapi:export and commit it" && exit 1)
      - name: Install Playwright browser
        run: pnpm --filter @eduerp/e2e exec playwright install --with-deps chromium
      - name: Web end-to-end tests (AC8)
        env:
          # The API test setup seeded this throwaway platform admin into the CI test database.
          SEED_ADMIN_EMAIL: platform@test.local
          SEED_ADMIN_PASSWORD: Platform@Test123
        run: pnpm --filter @eduerp/e2e e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

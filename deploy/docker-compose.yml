# EduERP server: Postgres, API, worker and HTTPS (Caddy) on one machine.
# Run from the deploy/ folder:   docker compose --env-file .env up -d --build
# First time / after each update, apply migrations:   docker compose --env-file .env run --rm migrate
name: eduerp-server
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduerp_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      POSTGRES_DB: eduerp
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the limited runtime login (eduerp_app: no superuser, row-level security always applies).
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduerp_owner -d eduerp"]
      interval: 5s
      retries: 20
    # Not published to the internet: only the API, worker and backups reach it.

  migrate:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    image: eduerp-api
    profiles: ["tools"]
    env_file: .env
    environment: &db
      DATABASE_URL: postgresql://eduerp_app:${POSTGRES_APP_PASSWORD}@postgres:5432/eduerp?connection_limit=15&pool_timeout=20
      DATABASE_OWNER_URL: postgresql://eduerp_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/eduerp
    depends_on: { postgres: { condition: service_healthy } }
    working_dir: /app/packages/db
    # Migrations (owner login), then permissions / roles / templates (safe to repeat), then the job queue.
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy && node dist/seed.js && cd /app/apps/api && node dist/worker/jobs-setup.main.js"]

  api:
    image: eduerp-api
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment: *db
    volumes: [files:/data/files]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/auth/me').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 30s
      retries: 5

  worker:
    image: eduerp-api
    restart: unless-stopped
    env_file: .env
    environment: *db
    volumes: [files:/data/files]
    depends_on: { postgres: { condition: service_healthy }, api: { condition: service_started } }
    command: ["node", "dist/worker/main.js"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:

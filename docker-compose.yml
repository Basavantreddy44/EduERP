name: eduerp
# S3-compatible storage is added with the files module (M0.2); the minio/minio image is no longer published on Docker Hub.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports: ["${POSTGRES_PORT}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT}:6379"]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
